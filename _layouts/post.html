---
layout: default
---
<style>
  .post-hero {
    padding: 24px 24px 20px;
    border-bottom: 0.5px solid var(--borde);
  }

  .post-kicker {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--rojo);
    margin-bottom: 8px;
  }

  .post-titulo {
    font-family: var(--serif);
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 400;
    line-height: 1.2;
    color: var(--tinta);
    margin-bottom: 10px;
    max-width: 620px;
  }

  .post-meta {
    font-size: 10px;
    color: var(--tinta-leve);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .post-cuerpo {
    padding: 24px;
    max-width: 620px;
  }

  .post-cuerpo p {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.85;
    color: var(--tinta-suave);
    margin-bottom: 18px;
  }

  .post-cuerpo h2 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 400;
    color: var(--tinta);
    margin: 28px 0 12px;
    padding-top: 20px;
    border-top: 0.5px solid var(--borde);
  }

  .post-cuerpo h3 {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    color: var(--tinta);
    margin: 20px 0 8px;
  }

  .post-cuerpo blockquote {
    border-left: 2px solid var(--rojo);
    margin: 20px 0;
    padding: 4px 0 4px 16px;
    font-style: italic;
    color: var(--tinta-media);
  }

  .post-cuerpo a {
    color: var(--rojo);
    text-decoration: none;
  }

  .post-cuerpo a:hover { text-decoration: underline; }

  .post-cuerpo ul, .post-cuerpo ol {
    padding-left: 20px;
    margin-bottom: 18px;
  }

  .post-cuerpo li {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.75;
    color: var(--tinta-suave);
    margin-bottom: 4px;
  }

  .post-volver {
    padding: 14px 24px;
    border-top: 0.5px solid var(--borde);
  }

  .post-volver a {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--tinta-media);
    text-decoration: none;
  }

  .post-volver a:hover { color: var(--rojo); }

  @media (max-width: 600px) {
    .post-hero, .post-cuerpo, .post-volver { padding-left: 16px; padding-right: 16px; }
  }
</style>

<div class="post-hero">
  <div class="post-kicker">{{ page.category | default: "Blog" }}</div>
  <h1 class="post-titulo">{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: "%-d de %B de %Y" }}
    {% if page.author %} · {{ page.author }}{% endif %}
  </div>
</div>

<div class="post-cuerpo">
  {{ content }}
</div>

<div class="post-volver">
  <a href="/blog">← volver al blog</a>
</div>
